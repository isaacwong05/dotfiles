# ASUS ROG Zephyrus G15 GA503RW (AMD 6900HS + RTX 3070 Ti) — NVIDIA tuning
# Runtime D3 and suspend notifiers are already on via the driver.
# Flip on S0ix power management: GPU reports platform support, so it drops to
# a low-power state during s2idle instead of idling the whole laptop.
# If suspend/resume misbehaves after reboot, delete this file and reboot.
options nvidia NVreg_EnableS0ixPowerManagement=1