# ========= border active =========
file_panel_border_active = "#d8dee9"
sidebar_border_active = "#b48ead"
footer_border_active = "#b48ead"
modal_border_active = "#868686"

# ========= background (bg) =========
full_screen_bg = "#2e3440"
file_panel_bg = "#2e3440"
sidebar_bg = "#2e3440"
footer_bg = "#2e3440"
modal_bg = "#2e3440"

# ========= foreground (fg) =========
full_screen_fg = "#e5e9f0"
file_panel_fg = "#e5e9f0"
sidebar_fg = "#e5e9f0"
footer_fg = "#e5e9f0"
modal_fg = "#e5e9f0"

# ========= special color =========
cursor = "#88c0d0"
correct = "#88c0d0"
error = "#bf616a"
hint = "#8fbcbb"
cancel = "#d8dee9"
