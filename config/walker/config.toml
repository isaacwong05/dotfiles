# walker overrides — restrained monochrome panel.
theme = "monochrome"
force_keyboard_focus = true
ext_background_effect_blur = true

[keybinds]
next = ["Down", "ctrl j"]
previous = ["Up", "ctrl k"]

[[providers.prefixes]]
prefix = "~o"
provider = "menus:obsidian"

[[providers.prefixes]]
prefix = "~p"
provider = "menus:power-profiles"

[shell]
layer = "overlay"
anchor_top = true
anchor_bottom = true
anchor_left = true
anchor_right = true
